<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Baxter Wyrd{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
    <div class="container">
        
        {% include 'sidebar.html' %}

        <div class="overlay" id="overlay"></div>

        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
    // --- SCRIPT UNIFICADO PARA TODA A APLICAÇÃO ---
    document.addEventListener('DOMContentLoaded', function() {
        
        // --- LÓGICA 1: Sidebar e Overlay ---
        const sidebar = document.getElementById('sidebar');
        const toggleButton = document.getElementById('sidebar-toggle');
        const overlay = document.getElementById('overlay');

        function toggleSidebar() {
            sidebar.classList.toggle('expanded');
            overlay.classList.toggle('active');
        }

        if (toggleButton && sidebar && overlay) {
            toggleButton.addEventListener('click', toggleSidebar);
            overlay.addEventListener('click', toggleSidebar);
        }

        // --- LÓGICA 2: Conexão WebSocket Global ---
        let myClientId = null;
        function conectarWebSocket() {
            const ws_protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const socket = new WebSocket(`${ws_protocol}//${window.location.host}/ws`);

            socket.onopen = function(event) {
                console.log("SUCESSO: Conexão WebSocket estabelecida.");
            };

            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === "CONNECTION_INFO") {
                        myClientId = data.client_id;
                        console.log("ID de cliente recebido:", myClientId);
                        // Disponibiliza o ID globalmente para outros scripts
                        window.myClientId = myClientId; 
                        return; 
                    }
                    window.dispatchEvent(new CustomEvent('websocket_message', { detail: data }));
                } catch (e) { /* Ignora */ }
            };

            socket.onclose = function(event) {
                console.warn("AVISO: Conexão WebSocket perdida. Tentando reconectar em 5s...");
                setTimeout(conectarWebSocket, 5000);
            };
        }
        conectarWebSocket(); // Inicia a conexão

        // --- LÓGICA 3: Interatividade da Tabela (Editar/Apagar) ---
        const table = document.querySelector('.data-table');
        if (table) {
            const editBtn = document.querySelector('.toolbar-actions .icon-btn[title="Editar"]');
            const deleteBtn = document.querySelector('.toolbar-actions .icon-btn[title="Apagar"]');
            let selectedRow = null;

            table.addEventListener('click', (event) => {
                const row = event.target.closest('.selectable-row');
                if (!row) return;

                if (selectedRow) {
                    selectedRow.style.backgroundColor = '';
                }
                row.style.backgroundColor = '#e0eafc'; 
                selectedRow = row;
            });

            if (editBtn) {
                editBtn.addEventListener('click', () => {
                    if (!selectedRow) {
                        alert('Por favor, selecione um item na tabela para editar.');
                        return;
                    }
                    const itemId = selectedRow.dataset.id;
                    const pageTitle = document.querySelector('h1').textContent.toLowerCase();
                    let editUrl = '';

                    if (pageTitle.includes('camas')) {
                        editUrl = `/beds/${itemId}/edit`;
                    } else if (pageTitle.includes('embarcados')) {
                        // Para embarcados, o ID é o id_esp, que já está no data-id
                        editUrl = `/embarcados/${itemId}/edit`;
                    }
                    
                    if (editUrl) {
                        window.location.href = editUrl;
                    }
                });
            }

            if (deleteBtn) {
                deleteBtn.addEventListener('click', () => {
                    if (!selectedRow) {
                        alert('Por favor, selecione um item na tabela para apagar.');
                        return;
                    }
                    if (confirm('Tem certeza que deseja apagar o item selecionado?')) {
                        const itemId = selectedRow.dataset.id;
                        const pageTitle = document.querySelector('h1').textContent.toLowerCase();
                        let deleteUrl = '';

                        if (pageTitle.includes('camas')) {
                            deleteUrl = `/beds/${itemId}/delete`;
                        } else if (pageTitle.includes('embarcados')) {
                            deleteUrl = `/embarcados/${itemId}/delete`;
                        }

                        if (deleteUrl) {
                            window.location.href = deleteUrl;
                        }
                    }
                });
            }
        }
    });
    </script>
    
    {% block scripts %}{% endblock %}

</body>
</html>
