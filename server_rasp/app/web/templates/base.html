<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Baxter Wyrd{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>
    <div class="container">

        {% include 'sidebar.html' %}

        <div class="overlay" id="overlay"></div>

        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
    // Ativa os ícones da biblioteca Feather
    feather.replace();

    // --- Script da Sidebar e Overlay ---
    const sidebar = document.getElementById('sidebar');
    const toggleButton = document.getElementById('sidebar-toggle');
    const overlay = document.getElementById('overlay');

    function toggleSidebar() {
        sidebar.classList.toggle('expanded');
        overlay.classList.toggle('active');
    }

    if (toggleButton && sidebar && overlay) {
        toggleButton.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);
    }

    // --- Script de Interatividade da Tabela ---
    document.addEventListener('DOMContentLoaded', function() {
        const table = document.querySelector('.data-table');
        if (!table) return;

        const editBtn = document.querySelector('.toolbar-actions .icon-btn[title="Editar"]');
        const deleteBtn = document.querySelector('.toolbar-actions .icon-btn[title="Apagar"]');
        let selectedRow = null;

        table.addEventListener('click', (event) => {
            const row = event.target.closest('.selectable-row');
            if (!row) return;

            if (selectedRow) {
                selectedRow.style.backgroundColor = '';
            }
            row.style.backgroundColor = '#e0eafc';
            selectedRow = row;
        });

        if (editBtn) {
            editBtn.addEventListener('click', () => {
                if (!selectedRow) {
                    alert('Por favor, selecione um item na tabela para editar.');
                    return;
                }
                const itemId = selectedRow.dataset.id;
                const pageTitle = document.querySelector('h1').textContent.toLowerCase();
                let editUrl = '';

                // MUDANÇA CRÍTICA AQUI
                if (pageTitle.includes('crachás')) {
                    editUrl = `/badges/${itemId}/edit`;
                } else if (pageTitle.includes('embarcados')) {
                    editUrl = `/embarcados/${itemId}/edit`;
                }

                if (editUrl) {
                    window.location.href = editUrl;
                }
            });
        }

        if (deleteBtn) {
            deleteBtn.addEventListener('click', () => {
                if (!selectedRow) {
                    alert('Por favor, selecione um item na tabela para apagar.');
                    return;
                }

                if (confirm('Tem certeza que deseja apagar o item selecionado?')) {
                    const itemId = selectedRow.dataset.id; // Este é o ID do banco de dados
                    const pageTitle = document.querySelector('h1').textContent.toLowerCase();
                    let deleteUrl = '';

                    if (pageTitle.includes('crachás')) {
                        // Correto: /badges/1/delete
                        deleteUrl = `/badges/${itemId}/delete`; 
                    } else if (pageTitle.includes('embarcados')) {
                        // Correto: /embarcados/1/delete
                        deleteUrl = `/embarcados/${itemId}/delete`;
                    }

                    if (deleteUrl) {
                        window.location.href = deleteUrl;
                    }
                }
            });
        }
    });
    </script>
</body>
</html>
