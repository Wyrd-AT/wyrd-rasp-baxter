{% extends "base.html" %}

{% block title %}Planta Baixa{% endblock %}

{% block content %}
<div class="content-header">
    <h1>Planta Baixa</h1>
</div>

<div id="planta-container" class="planta-container-unica">
    </div>

<div class="planta-sumario" id="planta-sumario">
    <span>-- quartos online</span>
    <span>-- ativos na planta</span>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function () {
    const plantaContainer = document.getElementById('planta-container');
    const plantaSumario = document.getElementById('planta-sumario'); // <-- Adicione esta linha

    // ... (o seu objeto coordenadasDosQuartos permanece igual) ...
    const coordenadasDosQuartos = {
        'quarto-1': { top: '15%', left: '30%' },
        'quarto-2': { top: '55%', left: '25%' },
        'quarto-3': { top: '56%', left: '42.5%' },
        'quarto-4': { top: '20%', left: '52.5%' },
        'quarto-5': { top: '20%', left: '65.5%' }
    };

    function atualizarPlanta() {
        fetch("{{ url_for('get_planta_dados') }}")
            .then(response => response.json())
            .then(data => { // <-- A estrutura de 'data' vai mudar
                plantaContainer.innerHTML = ''; 

                // A API agora devolve um objeto com 'quartos' e 'sumario'
                const dadosQuartos = data.quartos; 
                const dadosSumario = data.sumario;

                // Atualiza o texto do sumário
                plantaSumario.innerHTML = `
                    <span>${dadosSumario.quartos_online} quartos online</span>
                    <span>${dadosSumario.total_ativos} ativos na planta</span>
                `;

                // O resto do loop para renderizar os pontos permanece igual
                dadosQuartos.forEach(quarto => {
                    const pontoDiv = document.createElement('div');
                    pontoDiv.className = 'ponto-quarto-status';
                    
                    const coords = coordenadasDosQuartos[quarto.id_quarto] || { display: 'none' };
                    pontoDiv.style.top = coords.top;
                    pontoDiv.style.left = coords.left;
                    
                    // Lógica de cor (inalterada)
                    if (quarto.status_embarcado === 'Offline') {
                        pontoDiv.style.backgroundColor = '#6c757d';
                    } else if (quarto.numero_ativos > 0) {
                        pontoDiv.style.backgroundColor = '#28a745';
                    } else {
                        pontoDiv.style.backgroundColor = '#dc3545';
                    }

                    // Lógica do número dentro do ponto
                    const numeroAtivosSpan = document.createElement('span');
                    numeroAtivosSpan.className = 'ponto-numero-ativos';
                    if (quarto.status_embarcado !== 'Offline') {
                        numeroAtivosSpan.textContent = quarto.numero_ativos;
                    }
                    pontoDiv.appendChild(numeroAtivosSpan);

                    // Lógica do tooltip (inalterada)
                    let tooltipText = `${quarto.nome_quarto}`;
                    if (quarto.status_embarcado === 'Offline') {
                        tooltipText += `\n(Embarcado Offline)`;
                    } else if (quarto.numero_ativos > 0) {
                        quarto.ativos.forEach(a => { tooltipText += `\n- ${a.nome} (${a.horario_entrada})`; });
                    } else {
                        tooltipText += `\nLivre`;
                    }
                    pontoDiv.title = tooltipText;
                    
                    plantaContainer.appendChild(pontoDiv);
                });
            });
    }

    // Gatilhos para atualização (não mudam)
    window.addEventListener('websocket_open', () => atualizarPlanta());
    window.addEventListener('websocket_message', (event) => {
        if (event.detail === "ATUALIZAR_ESTADO") { atualizarPlanta(); }
    });
});
</script>
{% endblock %}
