{% extends "base.html" %}

{% block title %}Planta Baixa{% endblock %}

{% block content %}
<div class="content-header">
    <h1>Planta Baixa</h1>
</div>

<div class="planta-container-unica">
    <div id="planta-pontos-container">
        </div>
</div>

<div class="planta-sumario" id="planta-sumario">
    <div class="sumario-card card-quartos">
        <div class="sumario-icon">
            <span class="svg-icon" style="--icon-url: url({{ url_for('static', path='icons/quarto.svg') }})"></span>
        </div>
        <div class="sumario-texto">
            <div class="sumario-numero">--</div>
            <div class="sumario-label">Quartos Online</div>
        </div>
    </div>
    <div class="sumario-card card-ativos">
        <div class="sumario-icon">
            <span class="svg-icon" style="--icon-url: url({{ url_for('static', path='icons/ativo.svg') }})"></span>
        </div>
        <div class="sumario-texto">
            <div class="sumario-numero">--</div>
            <div class="sumario-label">Ativos na Planta</div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function () {
    const pontosContainer = document.getElementById('planta-pontos-container');
    const plantaSumario = document.getElementById('planta-sumario');

    // Coordenadas fixas para os 4 quartos.
    // **AJUSTE ESTES VALORES PARA POSICIONAR OS PONTOS NA SUA PLANTA**
    const coordenadasDosQuartos = {
        'quarto-1': { top: '31%', left: '20.5%' },
        'quarto-2': { top: '31%', left: '45.8%' },
        'quarto-3': { top: '31%', left: '67.7%' },
        'quarto-4': { top: '31%', left: '92.5%' },
        // Adicione mais quartos conforme necessário:
        // 'quarto-5': { top: 'X%', left: 'Y%' },
    };

    function atualizarPlanta() {
        fetch("{{ url_for('get_planta_dados') }}")
            .then(response => response.json())
            .then(data => {
                // --- ATUALIZAÇÃO DO SUMÁRIO (sem alterações) ---
                const quartosOnlineNumero = plantaSumario.querySelector('.card-quartos .sumario-numero');
                const ativosNaPlantaNumero = plantaSumario.querySelector('.card-ativos .sumario-numero');
                const sumarioData = data.sumario || { quartos_online: '--', total_ativos: '--' };
                if (quartosOnlineNumero) {
                    quartosOnlineNumero.textContent = sumarioData.quartos_online;
                }
                if (ativosNaPlantaNumero) {
                    ativosNaPlantaNumero.textContent = sumarioData.total_ativos;
                }

                // --- RENDERIZAÇÃO DOS PONTOS (com nova lógica) ---
                pontosContainer.innerHTML = ''; 
                const dadosQuartos = data.quartos || [];

                dadosQuartos.forEach(quarto => {
                    const pontoContainer = document.createElement('div');
                    pontoContainer.className = 'ponto-quarto-container';
                    const coords = coordenadasDosQuartos[quarto.id_quarto] || { display: 'none' };
                    pontoContainer.style.top = coords.top;
                    pontoContainer.style.left = coords.left;

                    // Lógica do Nome do Quarto (sem alteração)
                    const nomeQuartoSpan = document.createElement('span');
                    nomeQuartoSpan.className = 'ponto-nome-quarto';
                    nomeQuartoSpan.textContent = quarto.nome_quarto;
                    pontoContainer.appendChild(nomeQuartoSpan);
                    
                    // --- NOVA LÓGICA DE PRIORIDADE ---
                    // 1. Procura se existe algum ativo pendente neste quarto.
                    const pontoStatusDiv = document.createElement('div');
                    pontoStatusDiv.className = 'ponto-quarto-status';
                    
                    // --- NOVA LÓGICA DE PRIORIDADE DE COR ---
                    const ativoAlertado = quarto.ativos.find(a => a.status === 'alertado');
                    const ativoPendente = quarto.ativos.find(a => a.status === 'pendente');
                    const ativoConfirmado = quarto.ativos.find(a => a.status === 'confirmado');

                    if (quarto.status_embarcado === 'Offline') {
                        pontoStatusDiv.style.backgroundColor = '#6c757d'; // Cinza (Prioridade máxima)
                    } else if (ativoAlertado) {
                        pontoStatusDiv.style.backgroundColor = '#e74c3c'; // Vermelho forte para Alerta
                        pontoStatusDiv.classList.add('blinking-animation'); // Adiciona animação de piscar
                    } else if (ativoPendente) {
                        pontoStatusDiv.style.backgroundColor = '#fd7e14'; // Laranja
                    } else if (ativoConfirmado) {
                        pontoStatusDiv.style.backgroundColor = '#28a745'; // Verde
                    } else {
                        pontoStatusDiv.style.backgroundColor = '#dc3545'; // Vermelho (Livre)
                    }
                    pontoContainer.appendChild(pontoStatusDiv);
                    
                    // --- NOVA LÓGICA DE PRIORIDADE DE TEXTO ---
                    const nomeCamaSpan = document.createElement('span');
                    nomeCamaSpan.className = 'ponto-nome-cama';

                    if (quarto.status_embarcado === 'Offline') {
                        nomeCamaSpan.textContent = '(Offline)';
                    } else if (ativoAlertado) {
                        nomeCamaSpan.textContent = ativoAlertado.nome + ' (Alerta)';
                    } else if (ativoPendente) {
                        nomeCamaSpan.textContent = ativoPendente.nome + ' (Pendente)';
                    } else if (ativoConfirmado) {
                        nomeCamaSpan.textContent = ativoConfirmado.nome;
                    } else {
                        nomeCamaSpan.textContent = 'Livre';
                    }
                    pontoContainer.appendChild(nomeCamaSpan);
                });
            });
    }

    // O resto do script permanece igual
    function inicializar() {
        console.log("Inicializando a planta baixa...");
        atualizarPlanta();
    }

    window.addEventListener('websocket_open', inicializar);
    window.addEventListener('websocket_message', (event) => {
        if (event.detail === "ATUALIZAR_ESTADO") {
            atualizarPlanta();
        }
    });

    inicializar();
});
</script>
{% endblock %}
