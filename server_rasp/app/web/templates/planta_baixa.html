{% extends "base.html" %}

{% block title %}Planta Baixa{% endblock %}

{% block content %}
<div class="content-header">
    <h1>Planta Baixa</h1>
</div>

<div class="plantas-wrapper">

    <div class="planta-bloco">
        <h3 class="planta-titulo">Térreo</h3>
        <div class="planta-sumario" id="sumario-terreo">
            <span>-- quartos online</span>
            <span>-- ativos no andar</span>
        </div>
        <div id="planta-terreo" class="planta-container"></div>
    </div>

    <div class="planta-bloco">
        <h3 class="planta-titulo">Mezanino</h3>
        <div class="planta-sumario" id="sumario-mezanino">
            <span>-- quartos online</span>
            <span>-- ativos no andar</span>
        </div>
        <div id="planta-mezanino" class="planta-container"></div>
    </div>

</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function () {
    const containerTerreo = document.getElementById('planta-terreo');
    const containerMezanino = document.getElementById('planta-mezanino');
    const sumarioTerreo = document.getElementById('sumario-terreo');
    const sumarioMezanino = document.getElementById('sumario-mezanino');

    // =======================================================================
    //     VOCÊ AINDA PRECISA CONFIGURAR AS COORDENADAS
    // =======================================================================
    const coordenadasDosQuartos = {
        'quarto-1': { top: '57%', left: '20%' }, 'quarto-2': { top: '55%', left: '46%' },
        'quarto-3': { top: '37%', left: '49%' }, 'quarto-4': { top: '68%', left: '77%' },
        'quarto-5': { top: '48%', left: '77%' }, 'quarto-6': { top: '38%', left: '71%' }, 
        'quarto-7': { top: '38%', left: '83%' }, 'quarto-8': { top: '44%', left: '95%' },
        'quarto-9': { top: '45%', left: '83%' }
    };
    // =======================================================================

    function renderizarPontos(container, quartos) {
    container.innerHTML = ''; // Limpa pontos antigos
    quartos.forEach(quarto => {
        const pontoDiv = document.createElement('div');
        pontoDiv.className = 'ponto-quarto-status';
        
        const coords = coordenadasDosQuartos[quarto.id_quarto];
        if (!coords) return;

        pontoDiv.style.top = coords.top;
        pontoDiv.style.left = coords.left;

        // Lógica de cor (permanece a mesma)
        if (quarto.status_embarcado === 'Offline') {
            pontoDiv.style.backgroundColor = '#6c757d';
        } else if (quarto.numero_ativos > 0) {
            pontoDiv.style.backgroundColor = '#28a745';
        } else {
            pontoDiv.style.backgroundColor = '#dc3545';
        }

        // --- NOVA LÓGICA PARA ADICIONAR O NÚMERO DENTRO DO PONTO ---
        const numeroAtivosSpan = document.createElement('span');
        numeroAtivosSpan.className = 'ponto-numero-ativos';
        
        // Só mostra o número se o embarcado não estiver offline
        if (quarto.status_embarcado !== 'Offline') {
            numeroAtivosSpan.textContent = quarto.numero_ativos;
        }
        pontoDiv.appendChild(numeroAtivosSpan);
        // --- FIM DA NOVA LÓGICA ---

        // Lógica do tooltip (permanece a mesma)
        let tooltipText = `${quarto.nome_quarto}`;
        if (quarto.status_embarcado === 'Offline') {
            tooltipText += `\n(Embarcado Offline)`;
        } else if (quarto.numero_ativos > 0) {
            quarto.ativos.forEach(a => { tooltipText += `\n- ${a.nome} (${a.horario_entrada})`; });
        } else {
            tooltipText += `\nLivre`;
        }
        pontoDiv.title = tooltipText;
        
        container.appendChild(pontoDiv);
    });
}

    function atualizarPlanta() {
        fetch("{{ url_for('get_planta_dados') }}")
            .then(response => response.json())
            .then(data => {
                // Atualiza o sumário do Térreo
                const sumTerreo = data.terreo.sumario;
                sumarioTerreo.innerHTML = `
                    <span>${sumTerreo.quartos_online} quartos online</span>
                    <span>${sumTerreo.total_ativos} ativos no andar</span>`;
                
                // Atualiza o sumário do Mezanino
                const sumMezanino = data.mezanino.sumario;
                sumarioMezanino.innerHTML = `
                    <span>${sumMezanino.quartos_online} quartos online</span>
                    <span>${sumMezanino.total_ativos} ativos no andar</span>`;

                // Desenha os pontos para cada andar
                renderizarPontos(containerTerreo, data.terreo.quartos);
                renderizarPontos(containerMezanino, data.mezanino.quartos);
            });
    }

    // Gatilhos para atualização (não precisam de mudança)
    window.addEventListener('websocket_open', () => atualizarPlanta());
    window.addEventListener('websocket_message', (event) => {
        if (event.detail === "ATUALIZAR_ESTADO") { atualizarPlanta(); }
    });
});
</script>
{% endblock %}
