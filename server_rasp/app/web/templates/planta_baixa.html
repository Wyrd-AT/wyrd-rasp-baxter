{% extends "base.html" %}

{% block title %}{{ painel.nome }}{% endblock %}

{% block content %}
<div class="content-header">
    <h1>{{ painel.nome }}</h1>
    <a href="{{ url_for('list_paineis') }}" class="btn-primary">VOLTAR AOS PAINÉIS</a>
</div>

<div id="renderer-container" class="renderer-container">
    </div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function () {
    const rendererContainer = document.getElementById('renderer-container');
    const slugPainel = "{{ painel.slug }}";

    // Função que desenha um único ponto (quarto) na tela
    function renderizarPonto(quarto) {
        const pontoContainer = document.createElement('div');
        pontoContainer.className = 'ponto-quarto-container';
        pontoContainer.style.position = 'absolute';
        pontoContainer.style.left = `${quarto.pos_x}%`;
        pontoContainer.style.top = `${quarto.pos_y}%`;
        
        let statusColor = '#6c757d'; // Cinza (Offline) por padrão
        if (quarto.status_embarcado === 'Online') {
            statusColor = quarto.numero_ativos > 0 ? '#28a745' : '#dc3545'; // Verde (Ocupado) ou Vermelho (Livre)
        }

        let ativosTooltip = quarto.ativos.map(a => `\n- ${a.nome}`).join('');
        pontoContainer.title = `${quarto.nome_quarto}${ativosTooltip || '\nLivre'}`;

        pontoContainer.innerHTML = `
            <span class="ponto-nome-quarto">${quarto.nome_quarto}</span>
            <div class="ponto-quarto-status" style="background-color: ${statusColor};"></div>
            <span class="ponto-nome-cama">${quarto.numero_ativos > 0 ? quarto.ativos[0].nome : 'Livre'}</span>
        `;
        return pontoContainer;
    }

    // Função que desenha um andar inteiro (imagem de fundo + pontos)
    function renderizarAndar(andar) {
        const andarContainer = document.createElement('div');
        andarContainer.className = 'planta-container-dinamica';
        andarContainer.style.backgroundImage = `url(${andar.imagem_url})`;

        const pontosContainer = document.createElement('div');
        pontosContainer.className = 'planta-pontos-container';

        andar.quartos.forEach(quarto => {
            if (quarto.pos_x != null && quarto.pos_y != null) {
                pontosContainer.appendChild(renderizarPonto(quarto));
            }
        });
        
        andarContainer.appendChild(pontosContainer);
        return andarContainer;
    }

    // Função principal que busca os dados e decide o layout
    function atualizarPlanta() {
        fetch(`/api/plantas/${slugPainel}`)
            .then(response => response.json())
            .then(data => {
                rendererContainer.innerHTML = ''; // Limpa o conteúdo antigo
                rendererContainer.className = 'renderer-container'; // Reseta as classes

                switch (data.tipo_layout) {
                    case 'lado_a_lado':
                        rendererContainer.classList.add('layout-lado-a-lado');
                        data.andares.forEach(andar => {
                            rendererContainer.appendChild(renderizarAndar(andar));
                        });
                        break;
                    
                    case 'empilhado':
                        rendererContainer.classList.add('layout-empilhado');
                        data.andares.forEach(andar => {
                            rendererContainer.appendChild(renderizarAndar(andar));
                        });
                        break;
                    
                    case 'grid_hsa':
                         rendererContainer.classList.add('planta-grid-container'); // Reutiliza sua classe antiga
                         // A lógica aqui seria um pouco diferente, talvez renderizando cards em vez de plantas
                         // Por enquanto, vamos renderizar as plantas no grid
                         data.andares.forEach(andar => {
                            rendererContainer.appendChild(renderizarAndar(andar));
                        });
                        break;
                    
                    // Outros layouts como 'abas' podem ser adicionados aqui

                    case 'unico':
                    default:
                        rendererContainer.classList.add('layout-unico');
                        if (data.andares.length > 0) {
                            rendererContainer.appendChild(renderizarAndar(data.andares[0]));
                        }
                        break;
                }
            });
    }

    // Gatilhos para atualização
    window.addEventListener('websocket_open', atualizarPlanta);
    window.addEventListener('websocket_message', (event) => {
        if (event.detail === "ATUALIZAR_ESTADO") {
            atualizarPlanta();
        }
    });

    // Carga inicial
    atualizarPlanta();
});
</script>
{% endblock %}
