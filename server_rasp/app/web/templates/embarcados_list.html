{% extends "base.html" %}

{% block title %}Gestão de Embarcados{% endblock %}

{% block content %}
<div class="content-header">
    <h1>Embarcados</h1>
    <a href="{{ url_for('download_embarcados_csv') }}" class="btn-primary">DOWNLOAD CSV</a>
</div>

<div class="page-with-form">
    
    <div class="list-column">
        <div class="table-toolbar">
            <form method="get" action="{{ url_for('list_embarcados') }}" class="search-bar">
                <input type="text" name="search" placeholder="Pesquisar por ID, quarto ou andar" value="{{ search or '' }}">
                <button type="submit" class="icon-btn" title="Pesquisar"><i data-feather="search"></i></button>
            </form>
            <div class="toolbar-actions">
                <button class="icon-btn" title="Editar"><i data-feather="edit-2"></i></button>
                <button class="icon-btn" title="Apagar"><i data-feather="trash-2"></i></button>
            </div>
        </div>
        <table class="data-table">
            <thead>
                <tr>
                    <th>ID da ESP</th>
                    <th>QUARTO</th>
                    <th>ANDAR</th> 
                </tr>
            </thead>
            <tbody>
                {% for emb in embarcados %}
                <tr class="selectable-row" data-id="{{ emb.id }}"> <td>{{ emb.id_esp }}</td>
                    <td>{{ emb.quarto }}</td>
                    <td>{{ emb.andar or '---' }}</td> 
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <div class="form-column">
        {% include 'embarcado_form.html' %}
    </div>

</div>
{% endblock %}
