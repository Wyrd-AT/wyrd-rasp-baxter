<div class="form-card">
    <h3>{% if asset %}Editar Ativo{% else %}Cadastro de Ativo{% endif %}</h3>
    <form action="{{ form_action }}" method="post">
        <div class="form-group">
            <label for="nome_ativo">Nome da Cama</label>
            <input type="text" id="nome_ativo" name="nome_ativo" value="{{ asset.nome_ativo if asset else '' }}" placeholder="Ex: Cama 101-A" required>
        </div>

        <div class="form-group">
            <label for="mac_address">MAC Address do Wi-Fi</label>
            <input type="text" id="mac_address" name="mac_address" value="{{ asset.mac_address if asset else '' }}" placeholder="XX:XX:XX:XX:XX:XX">
        </div>

        <div class="form-group">
            <label for="mac_beacon">MAC do Beacon</label>
            <input type="text" id="mac_beacon" name="mac_beacon" value="{{ asset.mac_beacon if asset else '' }}" placeholder="XX:XX:XX:XX:XX:XX" required>
        </div>

        <button type="submit" class="btn-primary form-btn">{{ 'Atualizar' if asset else 'Salvar' }}</button>
    </form>
</div>
