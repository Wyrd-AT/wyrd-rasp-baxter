<div class="form-card">
    <form action="{{ form_action }}" method="post">
        <div class="form-header">
            <h3>{% if asset %}Editar Cama{% else %}Nova Cama{% endif %}</h3>
            <button type="submit" class="icon-btn icon-btn-primary" title="Salvar">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-save"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
            </button>
        </div>
        
        <div class="form-fields-grid" style="grid-template-columns: repeat(3, 1fr);">
            <div class="form-group">
                <label>Nome da Cama</label>
                <input type="text" name="nome_ativo" value="{{ asset.nome_ativo if asset else '' }}" placeholder="Ex: Cama 101" required>
            </div>
            
            <div class="form-group">
                <label>Tipo de Ativo</label>
                <input type="text" value="Cama Hospitalar" readonly style="cursor: default; background-color: #fff; color: #333;">
                <input type="hidden" name="tipo_ativo_id" value="{{ all_tipos_de_ativo[0].id if all_tipos_de_ativo else 1 }}">
            </div>

            <div class="form-group">
                <label>MAC Beacon (BLE)</label>
                <input type="text" name="mac_beacon" value="{{ asset.mac_beacon if asset else '' }}" placeholder="XX:XX:XX..." required>
            </div>
            
            <div class="form-group">
                <label>Modelo</label>
                <input type="text" name="modelo" value="{{ asset.modelo or '' }}" placeholder="Ex: Centrella">
            </div>

            <div class="form-group">
                <label>Fabricante</label>
                <input type="text" name="fabricante" value="{{ asset.fabricante or '' }}" placeholder="Ex: Hillrom">
            </div>
        </div>
    </form>
</div>
