<div class="form-card">
    <h3>{% if embarcado %}Editar Embarcado{% else %}Cadastro de Embarcados{% endif %}</h3>
    <form action="{{ form_action }}" method="post">
        <div class="form-group">
            <label for="id_esp">ID do Embarcado</label>
            <input type="text" id="id_esp" name="id_esp" value="{{ embarcado.id_esp if embarcado else '' }}" placeholder="XXXXXXXXXXXX" required
                {% if embarcado %}readonly{% endif %}>
        </div>
        <div class="form-group">
            <label for="quarto">Quarto</label>
            <input type="text" id="quarto" name="quarto" value="{{ embarcado.quarto if embarcado else '' }}" placeholder="Informe o quarto" required>
        </div>
        <div class="form-group">
            <label for="andar">Andar</label>
            <input type="text" id="andar" name="andar" value="{{ embarcado.andar if embarcado else '' }}" placeholder="Informe o andar">
        </div>
        <button type="submit" class="btn-primary form-btn">{{ 'Atualizar' if embarcado else 'Salvar' }}</button>
    </form>
</div>
