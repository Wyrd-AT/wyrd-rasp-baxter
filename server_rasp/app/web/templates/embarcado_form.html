{# embarcado_form.html (VERSÃO FINAL SIMPLIFICADA) #}
<form action="{{ form_action }}" method="post">
    
    <div class="form-header">
        <h3>{% if embarcado %}Editar Embarcado{% else %}Cadastro de Embarcados{% endif %}</h3>
        <button type="submit" class="icon-btn icon-btn-primary" title="{{ 'Atualizar' if embarcado else 'Salvar' }}">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-save"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
        </button>
    </div>
    
    <div class="form-fields-grid" style="grid-template-columns: repeat(2, 1fr);">
        <div class="form-group">
            <label for="id_esp">ID da ESP</label>
            <input type="text" id="id_esp" name="id_esp" value="{{ embarcado.id_esp if embarcado else '' }}" placeholder="Ex: WRD00000001" required {% if embarcado %}readonly{% endif %}>
        </div>
        
        <div class="form-group">
            <label for="quarto_id">Associar ao Quarto</label>
            <select id="quarto_id" name="quarto_id" required>
                <option value="" disabled selected>Selecione um quarto disponível...</option>
                
                {% if embarcado and embarcado.quarto %}
                    <option value="{{ embarcado.quarto.id }}" selected>{{ embarcado.quarto.nome }}</option>
                {% endif %}
                
                {% for quarto in available_quartos %}
                    <option value="{{ quarto.id }}">{{ quarto.nome }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label for="rssi_threshold">RSSI Mínimo Individual (dBm)</label>
            <input type="number" id="rssi_threshold" name="rssi_threshold"
                   value="{{ embarcado.rssi_threshold if embarcado and embarcado.rssi_threshold is not none else '' }}"
                   placeholder="Opcional. Padrão: Global">
        </div>

        <div class="form-group">
            <label for="connecta_id">ID de Integração</label>
            <input type="text" id="connecta_id" name="connecta_id" 
                   value="{{ embarcado.connecta_id if embarcado and embarcado.connecta_id else '' }}"
                   placeholder="Opcional. Ex: BA010101">
        </div>
    </div>
</form>
